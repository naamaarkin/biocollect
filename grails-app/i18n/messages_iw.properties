aekos.sampling.design=נא לבחור מבנה דיגום אשר מתאר הכי טוב כיצד התבססה הגישה שלך לאיסוף נתונים
aekos.sampling.design.help=נא לבחור מתוך הרשימה מבנה דיגום מדעי שלדעתך מייצג הכי טוב את גישת המבנה המשמשת להגדרת מיקומי המחקר ופרוטוקולי הניטור של סט הנתונים. כל מחקר הוא תרגיל באיסוף מידע אשר יש בו שונות בין אם היא בשליטת אוספ.ת הנתונים ובין אם לא. בלתי אפשרי לאסוף מידע או מדידות על כל פרט ופרט, לכן תמיד תיווצרנה הטייה או שגיאת דיגום. על מנת לצמצם שגיאות מסוג זה ולאסוף נתונים כמותיים, מנהלות ומנהלי פרויקטים מתכננות.ים מחקרים באמצעות תוכנה או מבנה דיגום רלוונטיים. כאן רשומים מספר מבני דיגום נפוצים אבל הם יכולים להפוך למבנים מותאמים כתלות במחקר. למידע נוסף חפשו בגוגל "experimental design".
aekos.sampling.design.suggest=אם סט הנתונים שלך נבנה באמצעות מבנה דיגום שאינו מופיע ברשימה לעיל, נא לפרט מבני דיגום שכאלה.
aekos.measurement.theme=אילו סוגי מדידות או תצפיות כלולים בסט הנתונים?
aekos.measurement.theme.help=נתונים יכולים להיות או מתצפיות ישירות או ממדידות שנאספו ממקור (נתונים גולמיים) או נובעים ממקורות אחרים כגון רישומי ממטרים מהשירות המטאורולוגי הישראלי, ערכים שהוצאו משכבות מרחביות של המרכז למיפוי ישראל (נתונים נגזרים). אלו יכולים להתחלק עוד לסוגי נתונים שונים, כגון נתונים רציפים (מספרים אמיתיים עם ערכים עשרוניים, למשל טמפרטורה, גובה, משקל), נתוני ספירות (מספרים חיוביים 1,2,3...), נתונים בינאריים (1/0, כן/לא, אמת/שקר), נתונים קטגוריאליים (למשל קבוצות כמו סוג דם, סוגי כיסוי צומח וקבוצות גיל) ואורדינליים (ציון יחסי המשמש במיוחד לדירוג מידע). סוג פחות נפוץ הוא נתונים מרובי-משתנים (multivariate data).
aekos.measurement.theme.suggest=איפה שסט הנתונים שלך מכיל סוגי מדידות אחרים שאינם חלק מהרשימה לעיל, נא לציין את הסוגים הללו.
aekos.method.measurement=אילו מאפיינים נמדדו או נצפו ונכללו לסט הנתונים?
aekos.method.measurement.help=נא לתאר את סוגי המשתנים שנצפו או נמדדו בסט הנתונים. אלו בדרך כלל תואמים לשמות העמודות בסט נתונים אבל לא בהכרח.
aekos.method.measurement.suggest=איפה שסט הנתונים שלך מכיל מאפיינים אקולוגיים אחרים שאינם חלק מהרשימה לעיל, נא לציין מאפיינים שכאלו.
aekos.method.name=מה שם השיטה המשמשת לאיסוף נתונים?
aekos.method.name.help=נא להכניס את שם השיטה המשמשת לאיסוף נתונים עבור סט הנתונים.
aekos.method.description=נא לתאר את השיטה המשמשת לאיסוף הנתונים.
aekos.method.description.help=נא לספק תקציר עבור השיטה, כולל הטכניקות שיושמו בשטח או במעבדה או במשרד, וכמו כן איפה, מתי ועל ידי מי הן בוצעו.
aekos.method.drift.description=אם השיטה השתנתה במהלך תקופת הפרויקט, נא לתאר כיצד ומתי.
aekos.method.drift.description.help=נא לספק פרטים אודות כיצד ומתי השתנו השיטות.
aekos.other.artefacts=איזה עוד מידע נאסף כחלק מסט הנתונים לזיהוי, ניתוח ו/או שמירת רשומות בהמשך?
aekos.other.artefacts.help=נא לבחור מידע אחר (למשל ואוצ'רים, ניתוח ו/או תיעוד רשומות) אשר נאסף עבור סט הנתונים הזה מתוך הרשימה הנפתחת.
aekos.other.artefacts.suggest=איפה שסט הנתונים שלך מכיל פריטים אחרים שאינם חלק מהרשימה לעיל, נא לפרט פריטים שכאלו.
