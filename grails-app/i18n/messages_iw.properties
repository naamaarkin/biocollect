aekos.management.datasharing.license=סוג רשיון גישה פתוחה השייך לסט הנתונים
aekos.management.datasharing.license.help=אקו-אינפורמטיקה של TERN מעודדת גישה פתוחה לנתנוים במימון ציבורי ורק מפרסמת סטים של נתונים תחת רישיון אחד כחלק ממדיניות הנתונים של TERN. רישיונות אחרים אינם מסופקים מכיוון שהם מגבילים גישה פתוחה. רישיון ייחוס בינלאומי 4.0 של קריאטיב קומונס (CC BY 4.0) מאפשר לאחרים להעתיק ולהפיץ את התוכן בכל מדיום או פורמט (שיתוף) ולערבב מחדש, להמיר ולבנות על התוכן לכל מטרה, אפילו מסחרית (התאמה). אין באפשרות מעניק.ת הרישיון (את.ה) לשלול את החופש הזה כל עוד המשתמשות.ים בנתונים (בעלות ובעלי הרישיון) פועלות.ים לפי תנאי הרישיון. חשוב לקרוא עוד אודות קרדיט מתאים, לציין אם בוצעו שינויים, אמצעים טכנולוגיים, חריגה או הגבלה, פרטיות, או זכויות מוסריות.
aekos.acknowledgement=איפה שא.נשים שאינם מחברות.ים תרמו לסט הנתונים וצריכות.ים לקבל הכרה על כך, נא לספק אמירה מתאימה.
aekos.acknowledgement.help=אם תורמות ותורמים אחרים למחקר צריכים לקבל הכרה, נא לספק הצהרה מתאימה המכירה בתורמות ותורמים שאינם מחברות או מחברים. ההכרה צריכה להיות תמציתית ולהכיר במענקים או במימון דומה.
aekos.embargoOption=איפה שסט הנתונים נמצא תחת אמברגו, נא לציין את תאריך סוף האמברגו.
aekos.embargoOption.help=סטים של נתונים הנמצאים בשימוש פעיל על ידי המחברות.ים, או שהמסמך המשוייך נמצא בבדיקה וטרם התקבל לפרסום (למשל דוקטורנטיות.ים) או שאינם זמינים לציבור מסיבות אחרות יכולים לעשות אמברגו באמצעות SHaRED. בהתחלה, תקופת האמברגו היא 3 שנים מתאריך ההגשה של סט או חבילת הנתונים. לאחר תאריך זה, הוא ייפתח לזמינות אוטומטית דרך AEKNOS (The Australian Ecological Knowledge Observation System). אם ברצונך להפוך את סט הנתונים שלך לזמין יותר מוקדם, יש לשלוח מייל לכתובת enquiry@aekos.org.au.
aekos.legalCustodianOrganisation=יש לבחור בארגון/ים הנחשב/ים הבעלים המשפטי של סט הנתונים (כלומר זכויות קניין רוחני על סט הנתונים).
aekos.legalCustodianOrganisation.help=יש לבחור את הארגון הנחשב אפוטרופוס של מערך הנתונים. אם הארגון המבוקש אינו ברשימה, נא לבחור "אחר - נא להציע ולספק את שם הארגון". נא לציין את הארגון שהוא בעל הזכויות לקניין רוחני על מערכי הנתונים. זה בדרך כלל מוחזק על ידי ארגון המחבר/ים כאשר הוענק מענק עבור המחקר. בחוזי מחקר, הקניין הרוחני מתואר והוא עשוי לערב ארגונים מרובים המשתפים פעולה. אם זהו המקרה, הארגון הבכיר צריך ליצור קשר עם המחברות והמחברים ולהחליט יחד איזה ארגון יקח אחריות על הזכויות על מערך הנתונים.
aekos.legalCustodianOrganisationType=סוג הארגון הממונה?
aekos.legalCustodianOrganisationType.help=יש לבחור את סוג הארגון של הבעלים. אם סוג הארגון הדרוש אינו ברשימה, נא לבחור 'אחר' - נא להציע ולספק את סוג הארגון.
aekos.management.curation.status=מהו סטטוס הפעילות של סט הנתונים?
aekos.management.curation.status.help=נא לציין את סטטוס ההשלמה הנוכחי של סט הנתונים.
aekos.management.curation.other=אילו פעולות אצירה יושמו לסט הנתונים?
aekos.management.curation.other.help=נא לפרט אילו פעולות אצירה יושמו לסט הנתונים.
