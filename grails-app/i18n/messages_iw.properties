project.survey.info.reliabilityTag.content=התגים הללו הם אידיקטור עבור משתמשות.ים בנתונים שלך למידת הביטחון שלך בדיוק הנתונים בכל אחד מארבעת האזורים החשובים לחוקרות.ים. חשוב לשקף בכנות אודות הנתונים שלך כדי לאפשר לאחרים לקבל החלטות טובות על התאמתם לשימוש שלהן.ם. בדרך כלל הסיווג צריך לשקף את הדיוק של הרשומה באיכות הנמוכה ביותר בסט הנתונים.
project.survey.info.spatialAccuracy.content=יש לציין את הקטגוריה המשקפת הכי טוב את הרשומה הכי פחות מדויקת מרחבית בסט הנתונים.
