project.survey.info.endDate.content=אם הסקר יימשך זמן מוגבל בלבד, כדאי להוסיף תאריך סיום. זה יעזור לא.נשים לדעת האם הפרויקט עוד פעיל, כמה זמן נותר להם להוסיף נתונים, וכו'. באפשרותך לשנות את תאריך הסיום בכל זמן.
