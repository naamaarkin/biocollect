aekos.submission.info.name=שם הגשה
aekos.submission.info.name.help=שם הגשה אשר מבדיל את ההגשה הזו מכל ההגשות האחרות שלך, כולל גרסאות קודמות של ההגשה או הגשות ישנות אשר הוכנסו באמצעות SHaRED. כותרת זו משמשת למטרות אדמיניסטרטיביות בתוך SHaRED וגם ממלא מראש את השם של סט הנתונים בהמשך השאלון.
