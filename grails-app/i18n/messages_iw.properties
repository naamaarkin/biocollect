project.survey.info.comments.content=סימון זה יאפשר לכל מי שצופה בנתונים עבור הפרויקט להוסיף תגובות על רשומות בודדות.
project.survey.info.logo=צירוף לוגו\:
project.survey.info.logo.content=הוספת לוגו לסקר שלך הופכת אותו ליותר גלוי וניתן לזיהוי. הוא יוצג לצד פרטי הסקר שלך בעמוד רישום הסקר וגם באפליקציות המובייל.
