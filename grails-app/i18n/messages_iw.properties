project.survey.info.methodName=שיטת סיקור/דיגום בשימוש\:
project.survey.info.methodName.content= יש להכניס את שם שיטת הסיקור או הדיגום אשר שימשה לאיסוף נתונים לסקר זה (למשל סקר ציפורים 20דונם 20 דקות).
project.survey.info.methodAbstract=תיאור שיטת הדיגום/הסיקור\:
project.survey.info.methodAbstract.content=נא לתאר את השיטה אשר שימשה לאיסוף נתונים עבור סקר זה. בפרט, יש לציין את משך מאמץ הדיגום, השטח שכוסה (גודל וצורה), מספר הא.נשים בקבוצת הדיגום ומומחיותן.ם הקולקטיבית, וכל דבר העשוי להשפיע על ייצוגיות הנתונים הנאספים.
