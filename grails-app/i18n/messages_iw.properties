aekos.dataset.summary=נא לספק סיכום של סט הנתונים
aekos.dataset.summary.help=הסיכום צריך לתאר בתמציתיות את הסקר, סוגי השיטות והבדיקות שבוצעו ונתוני התוצאות בסט הנתונים. (ללא הערות על ממצאים מדעיים וציטוטים.) לידיעתך, המשפטים המקדימים צריכים לתאר את סט הנתונים ואת השימוש החוזר הפוטנציאלי בו כדי לעודד שימוש חוזר שלו. הפסקאות הבאות צריכות להמשיך עם רקע המכניס את המחקר להקשר של עבודות קודמות. (למשל\: סט נתונים זה מתאר את הבריאות הפיזיולוגית של לטאת רב-חומט קצר-זנב (Tiliqua rugosa) באמצעות המטולוגיה, גודל גוף ונוכחות אקופרזיטים. נתונים אלו יכולים לשמש פעם נוספת עבור ניתוח השוואתי בין הבריאות הפיזיולוגית של לטאות בר לבן זו של לטאות בשבי. לזוחלים יבשתיים פוטנציאל להיות זקיפים סביבתיים חשובים בסביבות חקלאיות...)
aekos.dataset.version=גרסת ערכת הנתונים
aekos.dataset.version.help=גרסת סט הנתונים המוגש
aekos.project.keywords=נא לספק מספר מילות מפתח אשר לדעתך ישפרו את יכולת הגילוי של סט הנתונים.
aekos.project.keywords.help=יש לחשוב על מילות המפתח בתור מונחי חיפוש שסביר שא.נשים ימצאו ויעשו שימוש חוזר בסט הנתונים שלך. נא להפריד בין מילות המפתח שלך באמצעות פסיקים.
aekos.activity.usageGuide=נא לספק מידע כיצד סט הנתונים יוכל לשמש בעתיד על ידי אחרים
aekos.activity.usageGuide.help=נא לספק הנחיות קצרות העשויות לעזור לאחרים לעשות שימוש חוזר בסט הנתונים. מידע זה יכול לכלול טיפים לשילוב או השוואת סט נתונים זה עם סטים אחרים של נתונים. עבור מחקרים המערבים פרטיות, בקרת בטיחות או הגבלות נתונים, יש לכתוב כיצד מחברות.ים יוכלו לבקש גישה לנתונים מוגבלים.
aekos.activity.relatedDatasets=לאילו סטים אחרים של נתונים קשור סט הנתונים הזה?
aekos.activity.relatedDatasets.help=במידה וסט הנתונים הזה קשור לסטים של נתונים מחוץ לפרויקט זה, נא להכניס את הכותרות, המזהים וכל מידע אחר. למשל אולי את.ה מודע.ת לפרויקט אחר המנוהל על ידי ארגון אחר באותו שטח מחקר בזמן אחר, המתייחס לנושאים אחרים.
aekos.activity.urlImage=נא לספק צילום או תמונה אחרת שמייצגת חזותית את סט הנתונים או את הסביבה ממנה נאספו הנתונים
aekos.activity.urlImage.help=במידה וסט הנתונים שלך מכיל תמונות של האתרים בהם נאספו הנתונים, נא לבחור אחת שמייצגת הכי טוב את סביבת איסוף הנתונים. אם יש לך תמונות מסוגים אחרים אשר יכולות לייצג ויזואלית את הנתונים, נא לצרף אחת מהן.
