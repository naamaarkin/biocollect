project.survey.info.temporalAccuracy.content=נא לציין את הקטגוריה אשר משקפת הכי טוב את הרשומה הכי פחות מדויקת בסט הנתונים מבחינת תאריך התצפית.
project.survey.info.nonTaxonomicAccuracy.content=נא לציין את הקטגוריה אשר משקפת הכי טוב את הרשומה הכי פחות מדויקת בסט הנתונים מבחינת מאפיינים שאינם חלק ממגוון ביולוגי.
project.survey.info.dataQualityAssuranceMethod.content=נא לציין את כל השיטות להבטחת איכות הנתונים שיישמת במהלך תפיסת, אצירת וניהול סט הנתונים.
project.survey.info.dataQualityAssuranceDescription.content=נא לתאר את השיטות אשר שימשו להבטחת איכות סט הנתונים הן בתפיסה וכן בעיבוד אחר כך. זה חשוב בשביל שיוזרים אחרים יבינו את התהליכים שיושמו על הנתונים לאמת או לשפר את האיכות שלהם בשביל שימוש.
project.survey.info.dataAccessMethods.content=נא לציין אילו שיטות קיימות בשביל שא.נשים יוכלו לגשת לסט הנתונים.
project.survey.info.dataAccessExternalURL.content=אם הנתונים זמינים באמצעות אתר אינטרנט, נא להכניס את כתובת האינטרנט המלאה (URL) כדי שא.נשים יוכלו ללחוץ על הקישור לגשת לנתונים.
project.survey.info.isDataManagementPolicyDocumented.content=ציינ.י האם תכנית לניהול נתונים הוכנה עבור סט נתונים זה. אם 'כן', עליך לספר פרטים עבור התכנית באחת מהקטגוריות הדרושות לפחות.
project.survey.info.dataManagementPolicyDescription.content=נא לספק תיאור של מדיניות ניהול הנתונים. זה כולל כיצד הנתונים נאספים, מנוהלים, מאוחסנים, נאצרים וכו' וכיצד נתונים ופרטיות אישית מנוהלים.
project.survey.info.dataManagementPolicyURL.content=אם התכנית לניהול נתונים מפורסמת באינטרנט, נא להכניס כתובת אינטרנט מלאה (URL) המקשרת אליה.
project.survey.info.dataManagementPolicyDocument.content=נא לצרף מסמך Word או PDF של מדיניות ניהול הנתונים שלך.
